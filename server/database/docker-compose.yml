version: "3.9"

services:
  db:
    image: mongo:6
    container_name: db_container
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  nodeapp:
    build: .
    image: nodeapp
    container_name: node_container
    restart: always
    ports:
      - "3030:3030"
    depends_on:
      - db

volumes:
  mongo_data:
